<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logos/nuevo-icono-dataorbit.svg" />
    <link rel="apple-touch-icon" href="/logos/nuevo-icono-dataorbit.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataOrbit | Preparamos tu empresa para operar con IA</title>
    <meta name="description" content="Ordenamos tus datos, conectamos tus sistemas y construimos plataformas a la medida con IA incorporada. Partimos conversando con tu equipo y medimos el antes y el después." />
    
    <!-- Open Graph / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dataorbit.cl/" />
    <meta property="og:title" content="DataOrbit | Preparamos tu empresa para operar con IA" />
    <meta property="og:description" content="Ordenamos tus datos, conectamos tus sistemas y construimos plataformas a la medida con IA incorporada. Partimos conversando con tu equipo y medimos el antes y el después." />
    <!-- Imagen dentro del propio sitio (no depende de WordPress), 1200x630 como piden LinkedIn y WhatsApp -->
    <meta property="og:image" content="https://dataorbit.cl/og-dataorbit.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DataOrbit | Preparamos tu empresa para operar con IA" />
    <meta name="twitter:description" content="Ordenamos tus datos, conectamos tus sistemas y construimos plataformas a la medida con IA incorporada. Partimos conversando con tu equipo y medimos el antes y el después." />
    <meta name="twitter:image" content="https://dataorbit.cl/og-dataorbit.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Se carga sin bloquear el primer dibujo (el texto aparece con la fuente del sistema y cambia al cargar) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"></noscript>
  </head>
  <body class="bg-orbit-dark text-slate-100 font-sans antialiased selection:bg-orbit-blue/30 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
