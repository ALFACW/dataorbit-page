# Configuración Nginx para DataOrbit (dataorbit.cl)
# Cumple con issue ENG-204: SSL, www canónico, redirecciones 301 de WordPress y SPA

# 1. Redirigir HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name dataorbit.cl www.dataorbit.cl;
    return 301 https://dataorbit.cl$request_uri;
}

# 2. Redirigir HTTPS www a HTTPS no-www (versión canónica)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.dataorbit.cl;

    ssl_certificate /etc/letsencrypt/live/dataorbit.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dataorbit.cl/privkey.pem;

    return 301 https://dataorbit.cl$request_uri;
}

# 3. Servidor principal HTTPS canónico
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dataorbit.cl;

    root /var/www/dataorbit/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/dataorbit.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dataorbit.cl/privkey.pem;

    # Headers de seguridad y compresión
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Redirecciones 301 de URLs viejas de WordPress
    location = /eduorbit-360 { return 301 /; }
    location = /eduorbit-360/ { return 301 /; }
    location = /servicios { return 301 /#soluciones; }
    location = /servicios/ { return 301 /#soluciones; }
    location = /contacto { return 301 /#contacto; }
    location = /contacto/ { return 301 /#contacto; }
    location = /feed { return 301 /; }
    location = /feed/ { return 301 /; }
    location = /comments/feed { return 301 /; }
    location = /comments/feed/ { return 301 /; }

    # Bloqueo de rutas WordPress obsoletas
    location ~* /(wp-admin|wp-login\.php|xmlrpc\.php) {
        return 301 /;
    }

    # Caché para assets estáticos
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fallback de SPA para Vite/React
    location / {
        try_files $uri $uri/ /index.html;
    }
}
